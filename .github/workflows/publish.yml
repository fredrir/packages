name: Publish packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
  - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: fredrir/infra/.github/workflows/packages-publish.yml@607c305882e59a3ebbd70422a818594a98a50845
    secrets: inherit
    with:
      smoke-scope: quick
