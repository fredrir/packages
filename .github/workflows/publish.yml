name: Publish packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
  - cron: '23 4 * * *'
  - cron: '41 5 * * 1'
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: fredrir/infra/.github/workflows/packages-publish.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    secrets: inherit
    with:
      smoke-scope: ${{ github.event.schedule == '41 5 * * 1' && 'full' || 'quick' }}
